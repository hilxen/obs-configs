<!--
  Self-contained "digital rain" filler for the Screen scene's empty space
  (the "screen" capture source doesn't span the full 1920x1080 canvas;
  this fills the gap above the vertical GoPro feed, replacing a browser
  source that used to point at https://matrixscreensaver.online/).

  Purely decorative -- no OCR or layout constraints like stream-info.html.
  Same OBS Browser Source settings (width/scene item transform) as before;
  only the url changes. Run build.py after editing to regenerate
  matrix-rain.txt.
-->
<html>
<head>
<meta charset="utf-8">
<style>
html,body{margin:0;padding:0;background:#000;width:100%;height:100%;overflow:hidden;}
canvas{display:block;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Half-width katakana (classic Matrix look) plus digits/letters for variety.
const CHARS = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';

// 6x the original 9px -- the OBS source's native width/height are also
// set to 6x (1200x3600 instead of 200x600), with the scene's scale.x/y
// divided by 6 to compensate, so the on-screen size and column count stay
// identical but with far more real source detail per glyph before OBS's
// (now much gentler) scale-down.
const FONT_SIZE = 54;
const SPACING = FONT_SIZE * 1.2; // 20% more room between symbols than the glyph size itself
const TRAIL_LENGTH = 16;
let columns = 0;
let drops = [];

function setupDrops(){
  columns = Math.ceil(window.innerWidth / SPACING);
  drops = new Array(columns).fill(0).map(() => Math.floor(Math.random() * -40));
}
setupDrops();
window.addEventListener('resize', setupDrops);

function draw(){
  // translucent black over the previous frame -> fading trail effect
  ctx.fillStyle = 'rgba(0,0,0,0.05)';
  ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

  ctx.font = 'bold ' + FONT_SIZE + 'px Menlo, Consolas, "DejaVu Sans Mono", monospace';
  for (let i = 0; i < columns; i++){
    const x = i * SPACING;
    const headY = drops[i] * SPACING;

    // draw a full decaying tail every frame instead of relying solely on
    // the overlay fade -- keeps each column densely lit at all times.
    for (let t = 0; t < TRAIL_LENGTH; t++){
      const y = headY - t * SPACING;
      if (y < 0) continue;
      const char = CHARS[Math.floor(Math.random() * CHARS.length)];
      if (t === 0){
        ctx.fillStyle = '#B9FFB9';
      } else {
        ctx.fillStyle = 'rgba(0,255,70,' + Math.max(0, 1 - t / TRAIL_LENGTH) + ')';
      }
      ctx.fillText(char, x, y);
    }

    if (headY > window.innerHeight + TRAIL_LENGTH * SPACING && Math.random() > 0.95){
      drops[i] = 0;
    }
    drops[i]++;
  }
}

setInterval(draw, 50);
</script>
</body>
</html>
