<!--
  Self-contained "digital rain" filler for the Screen scene's empty space
  (the "screen" capture source doesn't span the full 1920x1080 canvas;
  this fills the gap above the vertical GoPro feed, replacing a browser
  source that used to point at https://matrixscreensaver.online/).

  Purely decorative -- no OCR or layout constraints like stream-info.html.
  Same OBS Browser Source settings (width/scene item transform) as before;
  only the url changes. Run build.py after editing to regenerate
  matrix-rain.txt.
-->
<html>
<head>
<meta charset="utf-8">
<style>
html,body{margin:0;padding:0;background:#000;width:100%;height:100%;overflow:hidden;}
canvas{display:block;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Katakana (classic Matrix look) + digits/Latin + Cyrillic -- but only the
// Cyrillic letters with a shape genuinely distinct from any Latin letter
// (excludes homoglyphs like А/В/Е/К/М/Н/О/Р/С/Т/У/Х, which are visually
// identical or near-identical to Latin letters already in the set and
// would add no real variety).
const CHARS = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZБГДЖЗИЙЛПФЦЧШЩЪЫЬЭЮЯ';

// Design size 9px x 6x supersampling = 54 native px.
const FONT_SIZE = 54;
const SPACING = FONT_SIZE * 1.2; // 20% more room between symbols than the glyph size itself
const TRAIL_LENGTH = 16;
let columns = 0;
let drops = [];
let trails = []; // trails[i][0] = column i's current head char, [1] = one step behind, etc.
                  // -- stable once drawn, so a trail position keeps showing the SAME
                  // glyph as it fades instead of a new random one overlapping it every
                  // frame (that double-exposure look is what made large glyphs look
                  // garbled/crossed-out).

function setupDrops(){
  columns = Math.ceil(window.innerWidth / SPACING);
  drops = new Array(columns).fill(0).map(() => Math.floor(Math.random() * -40));
  trails = new Array(columns).fill(0).map(() => []);
}
setupDrops();
window.addEventListener('resize', setupDrops);

function draw(){
  // translucent black over the previous frame -> fading trail effect
  ctx.fillStyle = 'rgba(0,0,0,0.05)';
  ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

  ctx.font = 'bold ' + FONT_SIZE + 'px Menlo, Consolas, "DejaVu Sans Mono", monospace';
  for (let i = 0; i < columns; i++){
    const x = i * SPACING;
    const headY = drops[i] * SPACING;

    trails[i].unshift(CHARS[Math.floor(Math.random() * CHARS.length)]);
    if (trails[i].length > TRAIL_LENGTH) trails[i].length = TRAIL_LENGTH;

    for (let t = 0; t < trails[i].length; t++){
      const y = headY - t * SPACING;
      if (y < 0) continue;
      if (t === 0){
        ctx.fillStyle = '#B9FFB9';
      } else {
        ctx.fillStyle = 'rgba(0,255,70,' + Math.max(0, 1 - t / TRAIL_LENGTH) + ')';
      }
      ctx.fillText(trails[i][t], x, y);
    }

    if (headY > window.innerHeight + TRAIL_LENGTH * SPACING && Math.random() > 0.95){
      drops[i] = 0;
      trails[i] = [];
    }
    drops[i]++;
  }
}

setInterval(draw, 50);
</script>
</body>
</html>
