<!--
  Self-contained "digital rain" filler for the Screen scene's empty space
  (the "screen" capture source doesn't span the full 1920x1080 canvas;
  this fills the gap above the vertical GoPro feed, replacing a browser
  source that used to point at https://matrixscreensaver.online/).

  Purely decorative -- no OCR or layout constraints like stream-info.html.
  Same OBS Browser Source settings (width/scene item transform) as before;
  only the url changes. Run build.py after editing to regenerate
  matrix-rain.txt.
-->
<html>
<head>
<meta charset="utf-8">
<style>
html,body{margin:0;padding:0;background:#000;width:100%;height:100%;overflow:hidden;}
canvas{display:block;}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// Half-width katakana (classic Matrix look) plus digits/letters for variety.
const CHARS = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';

const FONT_SIZE = 18;
let columns = 0;
let drops = [];

function setupDrops(){
  columns = Math.ceil(canvas.width / FONT_SIZE);
  drops = new Array(columns).fill(0).map(() => Math.floor(Math.random() * -40));
}
setupDrops();
window.addEventListener('resize', setupDrops);

function draw(){
  // translucent black over the previous frame -> fading trail effect
  ctx.fillStyle = 'rgba(0,0,0,0.08)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  ctx.font = FONT_SIZE + 'px monospace';
  for (let i = 0; i < columns; i++){
    const char = CHARS[Math.floor(Math.random() * CHARS.length)];
    const x = i * FONT_SIZE;
    const y = drops[i] * FONT_SIZE;

    // brighter leading character, dimmer green body
    ctx.fillStyle = '#B9FFB9';
    ctx.fillText(char, x, y);
    ctx.fillStyle = 'rgba(0,255,70,0.85)';
    ctx.fillText(CHARS[Math.floor(Math.random() * CHARS.length)], x, y - FONT_SIZE);

    if (y > canvas.height && Math.random() > 0.975){
      drops[i] = 0;
    }
    drops[i]++;
  }
}

setInterval(draw, 50);
</script>
</body>
</html>
