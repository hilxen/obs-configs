<!--
  Moblin-style status bar widget for OBS Browser Source.

  Layout: {weather emoji} {temp F/C} 🕒 {time}{flag} {city} 📉 {dropped%} 🤦‍♀️ {bitrate}/{total}

  OCR constraint: bot.py (twitch-delay-bot) crops a fixed 840x32 strip at
  (540, height-32, width-540, height) on a 1920x1080 canvas and reads it as
  one single text line (tesseract --psm 7). This widget's background MUST
  stay a full-bleed, edge-to-edge dark bar across the whole source -- a
  floating pill with transparent space around it leaves busy stream content
  in the rest of that crop band, which breaks OCR (confirmed live). Keep
  the OBS Browser Source itself sized at 840x32, positioned flush with the
  canvas's bottom edge, horizontally centered, 1:1 scale (no stretching).

  Run build.py after editing this file to regenerate stream-info.txt.
-->
<html>
<head>
<meta charset="utf-8">
<style>
html,body{margin:0;padding:0;background:transparent;width:100%;height:100%;overflow:hidden;}
#bar{position:fixed;left:0;right:0;bottom:0;height:100%;background-color:rgba(20,20,20,0.85);display:flex;align-items:center;justify-content:center;overflow:hidden;}
#line{color:white;font-family:monospace;font-size:18px;font-weight:bold;letter-spacing:0.5px;line-height:1;white-space:nowrap;}
</style>
</head>
<body>
<div id="bar"><div id="line"></div></div>
<script>
// OBS WebSocket (Tools -> WebSocket Server Settings) -- used for live
// dropped-frame% and bitrate/total. Server must be enabled with this
// password, listening on the default port.
const OBS_WS_URL = 'ws://127.0.0.1:4455';
const OBS_WS_PASSWORD = 'changeit';

// Fixed location (no geolocation API) -- used only for the weather lookup;
// not itself displayed.
const WEATHER_LAT = 33.0137;
const WEATHER_LON = -117.1253;
const CITY_LABEL = 'San Diego, CA';
const FLAG = '\u{1F1FA}\u{1F1F8}';

let clockText = '';
let weatherText = '\u{1F321}\u{FE0F} --/--';
let obsText = '\u{1F4C9} --% \u{1F926}‍♀\u{FE0F} --kbps/--MB';

function pad2(n){ return String(n).padStart(2,'0'); }

function updateClock(){
  const now = new Date();
  clockText = pad2(now.getHours())+':'+pad2(now.getMinutes())+':'+pad2(now.getSeconds());
  render();
}
setInterval(updateClock, 1000);
updateClock();

// Open-Meteo weather_code (WMO) -> emoji. Not exhaustive, covers common cases.
function weatherEmoji(code){
  if (code === 0) return '☀️';
  if (code === 1) return '\u{1F324}️';
  if (code === 2) return '⛅';
  if (code === 3) return '☁️';
  if (code === 45 || code === 48) return '\u{1F32B}️';
  if ([51,53,55,56,57].includes(code)) return '\u{1F326}️';
  if ([61,63,65,66,67,80,81,82].includes(code)) return '\u{1F327}️';
  if ([71,73,75,77,85,86].includes(code)) return '\u{1F328}️';
  if ([95,96,99].includes(code)) return '⛈️';
  return '\u{1F321}️';
}

// Open-Meteo: free, no API key. Refreshed every 15 min -- weather doesn't
// need second-by-second polling and this avoids any rate-limit concerns.
async function updateWeather(){
  try {
    const url = 'https://api.open-meteo.com/v1/forecast?latitude='+WEATHER_LAT+'&longitude='+WEATHER_LON+'&current=temperature_2m,weather_code&temperature_unit=fahrenheit';
    const res = await fetch(url);
    const data = await res.json();
    const f = Math.round(data.current.temperature_2m);
    const c = Math.round((f - 32) * 5 / 9);
    const emoji = weatherEmoji(data.current.weather_code);
    weatherText = emoji+' '+f+'°F/'+c+'°C';
  } catch (e) {
    weatherText = '\u{1F321}️ --/--';
  }
  render();
}
updateWeather();
setInterval(updateWeather, 15*60*1000);

function b64FromBuf(buf){
  let binary = '';
  const bytes = new Uint8Array(buf);
  for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
  return btoa(binary);
}
async function sha256base64(str){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return b64FromBuf(buf);
}

let lastBytes = null, lastTime = null;

// Minimal obs-websocket v5 client (hand-rolled, no external library):
// Hello(0) -> Identify(1) [with SHA-256 challenge/salt auth if required] ->
// Identified(2) -> poll GetStreamStatus via Request(6)/RequestResponse(7).
function connectObs(){
  let identified = false;
  let ws;
  try { ws = new WebSocket(OBS_WS_URL); } catch(e) { setTimeout(connectObs, 5000); return; }
  ws.onmessage = async (ev) => {
    let msg;
    try { msg = JSON.parse(ev.data); } catch(e) { return; }
    if (msg.op === 0) {
      const d = msg.d;
      let authField;
      if (d.authentication) {
        const secret = await sha256base64(OBS_WS_PASSWORD + d.authentication.salt);
        authField = await sha256base64(secret + d.authentication.challenge);
      }
      const identify = { op: 1, d: { rpcVersion: d.rpcVersion, eventSubscriptions: 0 } };
      if (authField) identify.d.authentication = authField;
      ws.send(JSON.stringify(identify));
    } else if (msg.op === 2) {
      identified = true;
      poll();
    } else if (msg.op === 7 && msg.d && msg.d.requestType === 'GetStreamStatus') {
      const r = msg.d.responseData;
      const now = Date.now();
      let kbps = 0;
      if (lastBytes !== null && lastTime !== null && r.outputActive) {
        const dt = (now - lastTime) / 1000;
        const db = r.outputBytes - lastBytes;
        if (dt > 0) kbps = Math.max(0, Math.round((db * 8 / 1000) / dt));
      }
      lastBytes = r.outputBytes;
      lastTime = now;
      const totalMB = (r.outputBytes / 1e6).toFixed(0);
      const droppedPct = r.outputTotalFrames > 0 ? (100 * r.outputSkippedFrames / r.outputTotalFrames).toFixed(1) : '0.0';
      obsText = r.outputActive
        ? ('\u{1F4C9} '+droppedPct+'% \u{1F926}‍♀️ '+kbps+'kbps/'+totalMB+'MB')
        : '\u{1F4C9} --% \u{1F926}‍♀️ offline';
      render();
    }
  };
  function poll(){
    if (!identified) return;
    ws.send(JSON.stringify({ op: 6, d: { requestType: 'GetStreamStatus', requestId: 'r'+Date.now() } }));
    setTimeout(poll, 3000);
  }
  ws.onclose = () => setTimeout(connectObs, 5000);
  ws.onerror = () => { try { ws.close(); } catch(e){} };
}
connectObs();

function render(){
  document.getElementById('line').textContent =
    weatherText+' \u{1F552} '+clockText+FLAG+' '+CITY_LABEL+' '+obsText;
}
render();
</script>
</body>
</html>
